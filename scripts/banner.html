<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>README banner</title>
<style>
  @font-face { font-family: Anton; src: url('../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url('../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2') format('woff2'); }

  html, body { margin: 0; width: 1600px; height: 520px; overflow: hidden; background: #0b0b0b; }
  .b { position: relative; width: 1600px; height: 520px; }
  .bg { position: absolute; right: -170px; top: -300px; width: 1320px; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #0b0b0b 0, #0b0b0b 34%, rgba(11,11,11,.72) 48%, rgba(11,11,11,0) 68%), linear-gradient(0deg, rgba(11,11,11,.55), rgba(11,11,11,0) 40%); }
  .seal { position: absolute; left: 64px; top: 64px; width: 300px; }

  .word .dot { color: #f2c329; }
  .tag { position: absolute; left: 400px; top: 86px; font: 700 30px/1.15 'Barlow Condensed'; letter-spacing: .14em; color: #f2f2ed; text-transform: uppercase; }
  .tag span { color: #f2c329; }
  .meta { position: absolute; left: 402px; top: 176px; font: 400 15px/1.7 'IBM Plex Mono'; letter-spacing: .16em; color: #b9b9b2; text-transform: uppercase; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #f2c329; }
  .cross { position: absolute; left: 1528px; top: 40px; width: 1px; height: 180px; background: #f2c329; }
  .crossh { position: absolute; left: 1470px; top: 70px; width: 110px; height: 1px; background: #f2c329; }
</style>
</head>
<body>
<div class="b">
  <img class="bg" src="../public/img/hero-mid-v2-1600.webp" alt="">
  <div class="shade"></div>
  <img class="seal" src="../public/img/logo-seal-v1-800.png" alt="">
  <div class="tag">Townsville Brake &amp; Wheel<br><span>Alignment Centre</span></div>
  <div class="meta">Wheel alignment · Brakes · Tyres · Suspension<br>Garbutt, Townsville QLD</div>
  <div class="word">Control<span class="dot">.</span></div>
  <div class="cross"></div><div class="crossh"></div>
  <div class="rule"></div>
</div>
</body>
</html>
